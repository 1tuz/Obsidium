<svg viewBox="0 160 1280 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obsidium-architecture-title obsidium-architecture-desc" id="obsidium-architecture-root">
        <title id="obsidium-architecture-title">Obsidium application architecture</title>
        <desc id="obsidium-architecture-desc">The Preact desktop UI and headless CLI call a shared Rust core, which synchronizes Markdown vault files and local application data. MCP clients can connect through stdio or localhost HTTP.</desc>
        <defs>
      <style>
      #obsidium-architecture-root { --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,.08);
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #obsidium-architecture-root { color: var(--ink); font-family: var(--sans); }
      #obsidium-architecture-root .subtitle { margin-bottom: 20px; color: var(--muted); font-size: 14px; }
      #obsidium-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #obsidium-architecture-root .diagram-container { overflow: visible; }</style>
