[package]
name = "aquilum-app"
version = "0.2.2"
description = "Fast local-first Markdown knowledge base"
authors = ["Dmitriy Chaplinskiy"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "aquilum_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
atomic-write-file = "0.3.0"
blake3 = "1.8.5"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.23.5", features = ["v4", "serde"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = { version = "2", optional = true }
tantivy = { version = "0.26.1", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
rust-stemmers = "1.2.0"
walkdir = "2.5.0"
notify = "8.2.0"
unicode-normalization = "0.1.25"
pulldown-cmark = "0.13.4"
ureq = "2.12"
httparse = "1"
yrs = "0.28"

[features]
updater = ["dep:tauri-plugin-updater"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 8
strip = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation"] }
