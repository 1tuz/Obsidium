name: Nightly full tests

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-tests
  cancel-in-progress: false

jobs:
  tests:
    name: Full frontend, Rust, and installer validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: obsidium-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: obsidium-app/src-tauri -> target

      - name: Install Tauri Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Install frontend dependencies
        working-directory: obsidium-app
        run: npm ci

      - name: Check TypeScript
        working-directory: obsidium-app
        run: npx tsc --noEmit

      - name: Run complete Vitest suite
        working-directory: obsidium-app
        run: npm test

      - name: Build frontend
        working-directory: obsidium-app
        run: npm run build

      - name: Build the CLI sidecar for the app bundle
        run: node scripts/prepare-cli-sidecar.mjs

      - name: Run complete Rust workspace tests
        run: cargo test --locked --manifest-path obsidium-app/src-tauri/Cargo.toml --workspace

      - name: Test installer scripts
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/install-cli.sh scripts/uninstall-cli.sh scripts/test-install-scripts.sh
          bash scripts/test-install-scripts.sh
          pwsh -NoProfile -File scripts/test-install-windows.ps1

  agent-integration:
    name: Agent surface integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: obsidium-app/src-tauri -> target

      - name: Build the CLI
        run: cargo build --locked --manifest-path obsidium-app/src-tauri/Cargo.toml -p obsidium-cli

      - name: Run the full agent surface smoke test
        run: node scripts/agent-smoke.mjs --full

  performance:
    name: Search and indexing budgets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: obsidium-app/src-tauri -> target

      - name: Install Tauri Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Run search and indexing benchmarks with a regression ceiling
        env:
          OBSIDIUM_BENCH_SIZES: 1000,10000
          # Deliberately generous: the gate exists to catch an accidental quadratic pass,
          # not to police a noisy shared runner.
          OBSIDIUM_BENCH_BUDGET_MS: 40000
        run: |
          cargo test --release --locked --manifest-path obsidium-app/src-tauri/Cargo.toml -p obsidium-core \
            benchmark_search_pipeline -- --ignored --nocapture
          cargo test --release --locked --manifest-path obsidium-app/src-tauri/Cargo.toml -p obsidium-core \
            benchmark_indexing -- --ignored --nocapture

  compile:
    name: Compile check on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            exe: ''
          - platform: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            exe: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: obsidium-app/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Build the CLI sidecar for the app bundle
        shell: bash
        run: |
          cargo build --locked --manifest-path obsidium-app/src-tauri/Cargo.toml -p obsidium-cli --target ${{ matrix.target }}
          mkdir -p obsidium-app/src-tauri/binaries
          cp "obsidium-app/src-tauri/target/${{ matrix.target }}/debug/obsidium${{ matrix.exe }}" \
            "obsidium-app/src-tauri/binaries/obsidium-${{ matrix.target }}${{ matrix.exe }}"

      - name: Check the whole workspace for platform-specific code
        run: cargo check --locked --manifest-path obsidium-app/src-tauri/Cargo.toml --workspace --all-targets --target ${{ matrix.target }}
