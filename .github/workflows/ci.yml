name: Fast checks and owner auto-merge

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lightweight checks
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      frontend_all: ${{ steps.changes.outputs.frontend_all }}
      rust_core: ${{ steps.changes.outputs.rust_core }}
      rust_code: ${{ steps.changes.outputs.rust_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: changes
        name: Detect changed code
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" ]]; then
            base_sha="$BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin main
            base_sha="$(git rev-parse FETCH_HEAD)"
          else
            git fetch --no-tags --depth=1 origin "$base_sha"
          fi

          git diff --check "$base_sha" "$GITHUB_SHA"
          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
          frontend=false
          frontend_all=false
          rust_core=false
          rust_code=false

          while IFS= read -r path; do
            case "$path" in
              aquilum-app/src/*|aquilum-app/vite.config.*|aquilum-app/tsconfig*.json)
                frontend=true
                ;;
              aquilum-app/package.json|aquilum-app/package-lock.json)
                frontend=true
                frontend_all=true
                ;;
              aquilum-app/core/src/*|aquilum-app/core/Cargo.toml|aquilum-app/src-tauri/Cargo.lock)
                rust_core=true
                rust_code=true
                ;;
              aquilum-app/src-tauri/src/*|aquilum-app/src-tauri/build.rs|aquilum-app/src-tauri/Cargo.toml|aquilum-app/cli/src/*|aquilum-app/cli/Cargo.toml)
                rust_code=true
                ;;
            esac
          done <<< "$changed_files"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "frontend_all=$frontend_all" >> "$GITHUB_OUTPUT"
          echo "rust_core=$rust_core" >> "$GITHUB_OUTPUT"
          echo "rust_code=$rust_code" >> "$GITHUB_OUTPUT"
          printf 'Detected changes: frontend=%s frontend_all=%s rust_core=%s rust_code=%s\n' "$frontend" "$frontend_all" "$rust_core" "$rust_code"

      - run: ruby scripts/check-workflow-yaml.rb

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aquilum-app/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: aquilum-app
        run: npm ci

      - name: Check frontend types
        if: steps.changes.outputs.frontend == 'true'
        working-directory: aquilum-app
        run: npx tsc --noEmit

      - name: Run frontend tests
        if: steps.changes.outputs.frontend == 'true'
        working-directory: aquilum-app
        env:
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
          RUN_ALL: ${{ steps.changes.outputs.frontend_all }}
        run: |
          if [[ "$RUN_ALL" == "true" ]]; then
            npm test
          else
            npm test -- --changed "$BASE_SHA" --passWithNoTests
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.rust_code == 'true'
        with:
          components: rustfmt

      - name: Check Rust formatting
        if: steps.changes.outputs.rust_code == 'true'
        run: cargo fmt --manifest-path aquilum-app/src-tauri/Cargo.toml --all -- --check

      - uses: actions/cache@v6
        if: steps.changes.outputs.rust_core == 'true'
        with:
          path: aquilum-app/src-tauri/target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('aquilum-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-core-

      - name: Run core tests
        if: steps.changes.outputs.rust_core == 'true'
        run: cargo test --manifest-path aquilum-app/src-tauri/Cargo.toml --locked -p aquilum-core --lib

  auto-merge:
    name: Merge owner changes after checks
    needs: checks
    if: ${{ (github.event_name == 'push' && github.actor == github.repository_owner && github.ref != 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.user.login == github.repository_owner) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Open or merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number="$PULL_REQUEST_NUMBER"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh pr list --repo "$GH_REPO" --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')"
            if [[ -z "$pr_number" ]]; then
              gh pr create \
                --repo "$GH_REPO" \
                --base main \
                --head "$BRANCH_NAME" \
                --title "Merge $BRANCH_NAME into main" \
                --body "Opened by CI after lightweight checks passed for ${GITHUB_SHA}."
              pr_number="$(gh pr list --repo "$GH_REPO" --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')"
            fi
          fi
          gh pr merge "$pr_number" --repo "$GH_REPO" --merge
