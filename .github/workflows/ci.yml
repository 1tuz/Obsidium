name: Fast checks and auto-merge

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic-checks:
    name: Basic checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - run: git diff --check HEAD^ HEAD

      - run: ruby scripts/check-workflow-yaml.rb

  auto-merge:
    name: Open PR and merge after checks
    needs: basic-checks
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Open or reuse PR and merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          pr_number="$(gh pr list --repo "$GH_REPO" --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Merge $BRANCH_NAME into main" \
              --body "Opened by CI after basic checks passed for ${GITHUB_SHA}."
            pr_number="$(gh pr list --repo "$GH_REPO" --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$pr_number" --repo "$GH_REPO" --merge
