name: CI

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run_checks: ${{ steps.route.outputs.runChecks }}
    steps:
      - uses: actions/checkout@v7
      - id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-routing.mjs "$EVENT_NAME"

  quality:
    name: Quality gate
    needs: route
    if: needs.route.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: changes
        with:
          base: main
          list-files: json
          filters: .github/filters.yml

      - name: Route manual checks through every lightweight test
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          for name in frontend_types frontend_related frontend_full rust_core rust_app rust_cli rust_workspace rust_lock agent_surface docs workflow release_contract installer_scripts; do
            echo "$name=true" >> "$GITHUB_OUTPUT"
          done

      - name: Validate workflow YAML and routing
        if: steps.changes.outputs.workflow == 'true' || steps.manual.outputs.workflow == 'true'
        run: |
          ruby scripts/check-workflow-yaml.rb
          ruby scripts/test-ci-routing.rb
          node --test scripts/ci-routing.test.mjs

      - name: Validate release contract
        if: steps.changes.outputs.release_contract == 'true' || steps.manual.outputs.release_contract == 'true'
        run: node --test scripts/release-contract.test.mjs

      - name: Test cross-platform installers
        if: steps.changes.outputs.installer_scripts == 'true' || steps.manual.outputs.installer_scripts == 'true'
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/install-cli.sh scripts/uninstall-cli.sh scripts/test-install-scripts.sh
          node --check scripts/prepare-cli-sidecar.mjs
          bash scripts/test-install-scripts.sh
          pwsh -NoProfile -File scripts/test-install-windows.ps1

      - name: Validate Rust source formatting
        if: steps.changes.outputs.rust_core == 'true' || steps.changes.outputs.rust_app == 'true' || steps.changes.outputs.rust_cli == 'true' || steps.changes.outputs.rust_workspace == 'true' || steps.manual.outputs.rust_core == 'true'
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_REF: origin/main
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RUST_CORE_FILES: ${{ steps.changes.outputs.rust_core_files }}
          RUST_APP_FILES: ${{ steps.changes.outputs.rust_app_files }}
          RUST_CLI_FILES: ${{ steps.changes.outputs.rust_cli_files }}
        run: node scripts/check-rust-format.mjs

      - name: Install actionlint
        if: steps.changes.outputs.workflow == 'true' || steps.manual.outputs.workflow == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Check all workflows with actionlint
        if: steps.changes.outputs.workflow == 'true' || steps.manual.outputs.workflow == 'true'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/actionlint"

      - name: Check diff formatting
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "origin/${BASE_REF}...HEAD"
          fi

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.frontend_types == 'true' || steps.changes.outputs.frontend_related == 'true' || steps.changes.outputs.frontend_full == 'true' || steps.manual.outputs.frontend_types == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: obsidium-app/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.frontend_types == 'true' || steps.changes.outputs.frontend_related == 'true' || steps.changes.outputs.frontend_full == 'true' || steps.manual.outputs.frontend_types == 'true'
        working-directory: obsidium-app
        run: npm ci

      - name: Check TypeScript
        if: steps.changes.outputs.frontend_types == 'true' || steps.manual.outputs.frontend_types == 'true'
        working-directory: obsidium-app
        run: npx tsc --noEmit

      - name: Run full Vitest suite
        if: steps.changes.outputs.frontend_full == 'true' || steps.manual.outputs.frontend_full == 'true'
        working-directory: obsidium-app
        run: npm test

      - name: Run tests related to changed frontend files
        if: steps.changes.outputs.frontend_related == 'true' && steps.changes.outputs.frontend_full != 'true' && steps.manual.outputs.frontend_full != 'true'
        working-directory: obsidium-app
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.frontend_related_files }}
        run: node ../scripts/run-related-vitest.mjs

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.rust_core == 'true' || steps.changes.outputs.rust_app == 'true' || steps.changes.outputs.rust_cli == 'true' || steps.changes.outputs.rust_workspace == 'true' || steps.changes.outputs.rust_lock == 'true' || steps.changes.outputs.agent_surface == 'true' || steps.manual.outputs.rust_core == 'true' || steps.manual.outputs.rust_lock == 'true' || steps.manual.outputs.agent_surface == 'true'
        with:
          components: rustfmt

      - name: Resolve the committed lockfile
        if: steps.changes.outputs.rust_lock == 'true' || steps.manual.outputs.rust_lock == 'true'
        run: cargo metadata --locked --format-version 1 --manifest-path obsidium-app/src-tauri/Cargo.toml > /dev/null

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.rust_core == 'true' || steps.changes.outputs.rust_app == 'true' || steps.changes.outputs.rust_cli == 'true' || steps.changes.outputs.rust_workspace == 'true' || steps.changes.outputs.agent_surface == 'true' || steps.manual.outputs.rust_core == 'true' || steps.manual.outputs.agent_surface == 'true'
        with:
          workspaces: obsidium-app/src-tauri -> target

      - name: Install Tauri Linux test dependencies
        if: steps.changes.outputs.rust_core == 'true' || steps.changes.outputs.rust_app == 'true' || steps.changes.outputs.rust_workspace == 'true' || steps.manual.outputs.rust_core == 'true' || steps.manual.outputs.rust_app == 'true' || steps.manual.outputs.rust_workspace == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Build the CLI sidecar for the app bundle
        if: steps.changes.outputs.rust_core == 'true' || steps.changes.outputs.rust_app == 'true' || steps.changes.outputs.rust_workspace == 'true' || steps.manual.outputs.rust_core == 'true' || steps.manual.outputs.rust_app == 'true' || steps.manual.outputs.rust_workspace == 'true'
        run: node scripts/prepare-cli-sidecar.mjs

      - name: Test changed Rust packages
        if: steps.changes.outputs.rust_core == 'true' || steps.changes.outputs.rust_app == 'true' || steps.changes.outputs.rust_cli == 'true' || steps.changes.outputs.rust_workspace == 'true' || steps.manual.outputs.rust_core == 'true'
        env:
          CORE_CHANGED: ${{ steps.changes.outputs.rust_core || steps.manual.outputs.rust_core }}
          APP_CHANGED: ${{ steps.changes.outputs.rust_app || steps.manual.outputs.rust_app }}
          CLI_CHANGED: ${{ steps.changes.outputs.rust_cli || steps.manual.outputs.rust_cli }}
          WORKSPACE_CHANGED: ${{ steps.changes.outputs.rust_core || steps.changes.outputs.rust_workspace || steps.manual.outputs.rust_core || steps.manual.outputs.rust_workspace }}
        run: |
          manifest=obsidium-app/src-tauri/Cargo.toml
          if [[ "$WORKSPACE_CHANGED" == "true" ]]; then
            git fetch --no-tags origin main
            changed="$(git diff -U0 origin/main -- "$manifest" obsidium-app/core/Cargo.toml obsidium-app/cli/Cargo.toml obsidium-app/src-tauri/Cargo.lock | grep -E '^[-+][^-+]' || true)"
            if [[ -n "$changed" ]] && ! grep -qvE '^[-+]version = "[0-9]+\.[0-9]+\.[0-9]+"$' <<<"$changed"; then
              echo "Only package versions changed; resolving the lock instead of rebuilding the workspace."
              cargo metadata --locked --format-version 1 --manifest-path "$manifest" > /dev/null
            else
              cargo test --locked --manifest-path "$manifest" --workspace
            fi
          else
            [[ "$CORE_CHANGED" != "true" ]] || cargo test --locked --manifest-path "$manifest" -p obsidium-core
            [[ "$APP_CHANGED" != "true" ]] || cargo test --locked --manifest-path "$manifest" -p obsidium-app
            [[ "$CLI_CHANGED" != "true" ]] || cargo test --locked --manifest-path "$manifest" -p obsidium-cli
          fi

      - name: Run the agent surface smoke test
        if: steps.changes.outputs.agent_surface == 'true' || steps.manual.outputs.agent_surface == 'true'
        run: |
          cargo build --locked --manifest-path obsidium-app/src-tauri/Cargo.toml -p obsidium-cli
          node scripts/agent-smoke.mjs

  performance:
    name: Performance gate
    needs: route
    if: needs.route.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: changes
        with:
          base: main
          filters: .github/filters.yml

      - name: Check whether the core performance surface changed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          CORE_CHANGED: ${{ steps.changes.outputs.rust_core_bench }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$CORE_CHANGED" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::obsidium-app/core is untouched by this push; the performance gate did not run."
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          workspaces: obsidium-app/src-tauri -> target
          key: performance

      - name: Benchmark indexing and search on 1000 notes
        if: steps.scope.outputs.run == 'true'
        env:
          OBSIDIUM_BENCH_SIZES: '1000'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bench"
          for bench in benchmark_indexing benchmark_search_pipeline; do
            cargo test --release --locked --manifest-path obsidium-app/src-tauri/Cargo.toml -p obsidium-core \
              --lib "$bench" -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/bench/$bench.log"
          done

      - name: Publish the measurement table
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          {
            echo "## Performance (release, 1000 notes)"
            echo
            node obsidium-app/scripts/bench/summarize.mjs --format=summary "$RUNNER_TEMP"/bench/*.log || true
            echo
            echo "<details><summary>BENCH- lines</summary>"
            echo
            echo '```'
            grep -h '^BENCH-' "$RUNNER_TEMP"/bench/*.log || true
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on a regression against the baseline
        if: steps.scope.outputs.run == 'true'
        run: |
          set -o pipefail
          node obsidium-app/scripts/bench/check-regression.mjs \
            --baseline=obsidium-app/scripts/bench/baseline.json \
            "$RUNNER_TEMP"/bench/*.log | tee -a "$GITHUB_STEP_SUMMARY"

  auto-merge:
    name: Merge owner changes after checks
    needs: [route, quality, performance]
    if: >-
      success() &&
      github.event_name == 'push' && github.actor == github.repository_owner && needs.route.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Open or merge the owner's pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          pr_number="$(gh pr list --repo "$GH_REPO" --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create --repo "$GH_REPO" --base main --head "$BRANCH_NAME" \
              --title "Merge $BRANCH_NAME into main" \
              --body "Opened by CI after the full diff passed the required checks for ${GITHUB_SHA}."
            pr_number="$(gh pr list --repo "$GH_REPO" --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')"
          fi
          if gh pr merge "$pr_number" --repo "$GH_REPO" --merge; then
            exit 0
          fi
          if gh pr update-branch "$pr_number" --repo "$GH_REPO"; then
            echo "::notice::Branch was behind main; the update triggers the next run, which merges it."
            exit 0
          fi
          echo "::error::Neither the merge nor the branch update succeeded for pull request ${pr_number}." >&2
          exit 1
