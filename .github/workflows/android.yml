name: Android companion

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a release APK with the independent Obsidium signing key
        type: boolean
        default: false
      test_core:
        description: Run the upstream core test suite before packaging
        type: boolean
        default: true
  workflow_call:
    inputs:
      signed_release:
        type: boolean
        default: false
      test_core:
        type: boolean
        default: true
    secrets:
      OBSIDIUM_ANDROID_KEYSTORE_BASE64:
        required: false
      OBSIDIUM_ANDROID_STORE_PASSWORD:
        required: false
      OBSIDIUM_ANDROID_KEY_ALIAS:
        required: false
      OBSIDIUM_ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ inputs.signed_release && 'release' || 'preview' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BUILD_VARIANT: ${{ inputs.signed_release && 'release' || 'debug' }}
      OBSIDIUM_DROPBOX_APP_KEY: ${{ vars[inputs.signed_release && 'OBSIDIUM_DROPBOX_APP_KEY' || 'OBSIDIUM_DROPBOX_DEBUG_APP_KEY'] }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/mobile/android/.build/cargo
    steps:
      - uses: actions/checkout@v7

      - name: Check the downstream integration
        run: python3 -m unittest discover -s mobile/android/tests -v

      - name: Prepare the pinned upstream and Obsidium overlay
        id: source
        run: python3 mobile/android/prepare.py --github-output "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/android/.build/source/aquilum-app -> ../../cargo
          key: android-${{ steps.source.outputs.commit }}
          cache-on-failure: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ steps.source.outputs.gradle }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install pinned Android tools
        env:
          NDK_VERSION: ${{ steps.source.outputs.ndk }}
          COMPILE_SDK: ${{ steps.source.outputs.compile_sdk }}
          BUILD_TOOLS: ${{ steps.source.outputs.build_tools }}
          CARGO_NDK_VERSION: ${{ steps.source.outputs.cargo_ndk }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\n%.0s' {1..100} | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;$NDK_VERSION" "platforms;android-$COMPILE_SDK" "build-tools;$BUILD_TOOLS"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Load the independent release signing key
        if: inputs.signed_release
        env:
          KEYSTORE_BASE64: ${{ secrets.OBSIDIUM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import tempfile
          value = os.environ.get("KEYSTORE_BASE64", "")
          if not value:
              raise SystemExit("Missing OBSIDIUM_ANDROID_KEYSTORE_BASE64")
          data = base64.b64decode(value, validate=True)
          fd, path = tempfile.mkstemp(prefix="obsidium-release-", suffix=".keystore", dir=os.environ["RUNNER_TEMP"])
          with os.fdopen(fd, "wb") as output:
              output.write(data)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"OBSIDIUM_ANDROID_KEYSTORE={path}\n")
          PY

      - name: Build, verify identity and signature, package sources
        env:
          TEST_CORE: ${{ inputs.test_core }}
          OBSIDIUM_ANDROID_STORE_PASSWORD: ${{ secrets.OBSIDIUM_ANDROID_STORE_PASSWORD }}
          OBSIDIUM_ANDROID_KEY_ALIAS: ${{ secrets.OBSIDIUM_ANDROID_KEY_ALIAS }}
          OBSIDIUM_ANDROID_KEY_PASSWORD: ${{ secrets.OBSIDIUM_ANDROID_KEY_PASSWORD }}
        run: |
          args=(--variant "$BUILD_VARIANT")
          if [[ "$TEST_CORE" == true ]]; then args+=(--test-core); fi
          python3 mobile/android/build.py "${args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: obsidium-android-${{ env.BUILD_VARIANT }}-${{ github.run_number }}
          path: mobile/android/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Write build scope
        env:
          UPSTREAM: ${{ steps.source.outputs.commit }}
        run: |
          {
            echo '## Obsidium Android companion'
            echo "Variant: $BUILD_VARIANT"
            echo "Aquilum commit: $UPSTREAM"
            echo 'APK identity and signing were checked. No emulator or real-device run was performed.'
            echo 'The artifact includes the patched source snapshot and build integration.'
            echo 'Desktop installers, desktop updater and release publication were not changed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          case "${OBSIDIUM_ANDROID_KEYSTORE:-}" in
            "$RUNNER_TEMP"/obsidium-release-*) rm -f -- "$OBSIDIUM_ANDROID_KEYSTORE" ;;
          esac
