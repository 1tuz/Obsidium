name: Sync upstream fork

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare upstream change branch
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Freaction/Aquilum.git
          git fetch upstream main

          upstream_sha="$(git rev-parse upstream/main)"
          last_synced="$(node -e 'const fs=require("fs");try{process.stdout.write(JSON.parse(fs.readFileSync(".github/upstream-sync.json","utf8")).upstream||"")}catch{}')"
          if [[ -z "$last_synced" ]]; then
            last_synced="$(git log -1 --format=%B --grep='^Upstream-Sync:' | sed -n 's/^Upstream-Sync: //p')"
          fi
          if [[ -z "$last_synced" ]]; then
            last_synced="$(git merge-base HEAD upstream/main)"
          fi
          if ! git merge-base --is-ancestor "$last_synced" upstream/main; then
            echo "Recorded upstream commit is not on upstream/main: $last_synced" >&2
            exit 1
          fi

          patch_file="$(mktemp)"
          manifest_file="$(mktemp)"
          trap 'rm -f "$patch_file" "$manifest_file"' EXIT
          git diff --binary "$last_synced" "$upstream_sha" -- aquilum-app/core \
            ':(exclude,top)aquilum-app/core/Cargo.toml' > "$patch_file"
          git diff "$last_synced" "$upstream_sha" -- aquilum-app/core/Cargo.toml > "$manifest_file"

          if [[ ! -s "$patch_file" ]]; then
            echo 'No upstream core changes to apply.'
            exit 0
          fi

          branch="sync/upstream-${upstream_sha:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
            if [[ -z "$pr_number" ]]; then
              echo "Branch $branch exists without an open upstream PR; refusing to overwrite it." >&2
              exit 1
            fi
            {
              echo "branch=$branch"
              echo "pr_number=$pr_number"
              echo "upstream_sha=$upstream_sha"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch --create "$branch"
          if ! git apply -p2 --directory=obsidium-app --3way "$patch_file" > apply.log 2>&1; then
            blocked="$(sed -n "s/^error: patch failed: obsidium-app\/\(.*\):.*/\1/p" apply.log | sort -u)"
            {
              echo "Upstream core sync is blocked by conflicts."
              echo
              echo "Upstream range: \`${last_synced:0:12}..${upstream_sha:0:12}\`"
              echo
              echo "The fork core keeps its own names and paths, so these files need a manual port:"
              echo
              if [[ -n "$blocked" ]]; then
                while IFS= read -r file; do
                  printf -- "- **obsidium-app/%s**\n" "$file"
                done <<< "$blocked"
              else
                echo 'See the workflow log for the failed hunks.'
              fi
              echo
              echo "Apply locally with:"
              echo
              echo '~~~bash'
              echo "git diff --binary ${last_synced} ${upstream_sha} -- aquilum-app/core ':(exclude,top)aquilum-app/core/Cargo.toml' \\"
              echo '  | git apply -p2 --directory=obsidium-app --3way'
              echo '~~~'
            } > issue.md
            title='Upstream core sync needs a manual port'
            issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file issue.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue.md
            fi
            echo 'Upstream core changes conflict with the fork layout; reported instead of pushing.'
            exit 0
          fi
          git checkout -- apply.log 2>/dev/null || rm -f apply.log
          printf '{\n  "upstream": "%s"\n}\n' "$upstream_sha" > .github/upstream-sync.json
          git add -A
          git commit -m 'sync: apply upstream core changes' -m "Upstream-Sync: $upstream_sha"
          git push origin "$branch"
          manifest_note=''
          if [[ -s "$manifest_file" ]]; then
            manifest_note="$(printf '\nUpstream changed **aquilum-app/core/Cargo.toml**; the fork keeps its own manifest, so reconcile dependencies by hand.\n\n<details><summary>Upstream manifest diff</summary>\n\n~~~diff\n%s\n~~~\n\n</details>\n' "$(cat "$manifest_file")")"
          fi
          pr_number="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Sync upstream core through ${upstream_sha:0:12}" \
            --body "Upstream core changes through https://github.com/Freaction/Aquilum/commit/${upstream_sha} are ready for the required CI checks.${manifest_note}")"
          {
            echo "branch=$branch"
            echo "pr_number=${pr_number##*/}"
            echo "upstream_sha=$upstream_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch full-diff CI for the upstream pull request
        if: steps.changes.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.changes.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH_NAME"
