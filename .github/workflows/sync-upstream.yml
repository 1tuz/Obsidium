name: Sync upstream fork

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare upstream change branch
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Freaction/Aquilum.git
          git fetch upstream main

          upstream_sha="$(git rev-parse upstream/main)"
          last_synced="$(git log -1 --format=%B --grep='^Upstream-Sync:' | sed -n 's/^Upstream-Sync: //p')"
          if [[ -z "$last_synced" ]]; then
            last_synced="$(git merge-base HEAD upstream/main)"
          fi
          if ! git merge-base --is-ancestor "$last_synced" upstream/main; then
            echo "Recorded upstream commit is not on upstream/main: $last_synced" >&2
            exit 1
          fi

          patch_file="$(mktemp)"
          trap 'rm -f "$patch_file"' EXIT
          git diff --binary "$last_synced" "$upstream_sha" -- . \
            ':(exclude,top).github/**' \
            ':(exclude,top)README.md' \
            ':(exclude,top)README.ru.md' \
            ':(exclude,top)DEVELOPMENT.md' \
            ':(exclude,top)AGENTS.md' \
            ':(exclude,top)scripts/**' \
            ':(exclude,top)knowledge base/**' \
            ':(exclude,top)assets/screenshots/**' \
            ':(exclude,top)assets/readme/**' \
            ':(exclude,top)assets/logo.png' \
            ':(exclude,top)aquilum-app/src-tauri/icons/**' > "$patch_file"

          if [[ ! -s "$patch_file" ]]; then
            echo 'No upstream source changes to apply.'
            exit 0
          fi

          branch="sync/upstream-${upstream_sha:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
            if [[ -z "$pr_number" ]]; then
              echo "Branch $branch exists without an open upstream PR; refusing to overwrite it." >&2
              exit 1
            fi
            {
              echo "branch=$branch"
              echo "pr_number=$pr_number"
              echo "upstream_sha=$upstream_sha"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch --create "$branch"
          git apply --3way "$patch_file"
          git add -A
          git commit -m 'sync: apply upstream source changes' -m "Upstream-Sync: $upstream_sha"
          git push origin "$branch"
          pr_number="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Sync upstream through ${upstream_sha:0:12}" \
            --body "Upstream source changes through https://github.com/Freaction/Aquilum/commit/${upstream_sha} are ready for the required CI checks.")"
          {
            echo "branch=$branch"
            echo "pr_number=${pr_number##*/}"
            echo "upstream_sha=$upstream_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch full-diff CI for the upstream pull request
        if: steps.changes.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.changes.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH_NAME"
