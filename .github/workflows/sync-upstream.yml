name: Sync upstream fork

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply upstream source changes and keep fork-owned files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Freaction/Aquilum.git
          git fetch upstream main

          upstream_sha="$(git rev-parse upstream/main)"
          last_synced="$(git log -1 --format=%B --grep='^Upstream-Sync:' | sed -n 's/^Upstream-Sync: //p')"
          if [[ -z "$last_synced" ]]; then
            last_synced="$(git merge-base HEAD upstream/main)"
          fi
          if ! git merge-base --is-ancestor "$last_synced" upstream/main; then
            echo "Recorded upstream commit is not on upstream/main: $last_synced" >&2
            exit 1
          fi

          patch_file="$(mktemp)"
          trap 'rm -f "$patch_file"' EXIT
          git diff --binary "$last_synced" "$upstream_sha" -- . \
            ':(exclude,top).github/**' \
            ':(exclude,top)README.md' \
            ':(exclude,top)README.ru.md' \
            ':(exclude,top)DEVELOPMENT.md' \
            ':(exclude,top)AGENTS.md' \
            ':(exclude,top)scripts/**' \
            ':(exclude,top)knowledge base/**' \
            ':(exclude,top)screenshots/**' \
            ':(exclude,top)assets/readme/**' \
            ':(exclude,top)obsidian-crystal-belt-icon.png' \
            ':(exclude,top)aquilum-app/src-tauri/icons/**' > "$patch_file"

          if [[ ! -s "$patch_file" ]]; then
            if [[ "$upstream_sha" != "$last_synced" ]]; then
              git commit --allow-empty \
                -m "sync: record upstream checkpoint" \
                -m "Upstream-Sync: $upstream_sha"
              git push origin HEAD:main
              echo "Recorded upstream checkpoint $upstream_sha; no source changes needed."
            else
              echo "No upstream source changes to apply; already current through $upstream_sha."
            fi
            exit 0
          fi

          git apply --3way "$patch_file"
          git add -A
          git commit -m "sync: apply upstream source changes" -m "Upstream-Sync: $upstream_sha"
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
