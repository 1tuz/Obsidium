name: Sync upstream fork

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream changes and keep fork workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Freaction/Aquilum.git
          git fetch upstream main
          previous="$(git rev-parse HEAD)"

          if ! git merge --no-edit upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ -z "$conflicts" ]]; then
              echo "Upstream merge failed without a resolvable file conflict." >&2
              exit 1
            fi

            while IFS= read -r path; do
              case "$path" in
                .github/workflows/*)
                  git checkout --ours -- "$path"
                  git add -- "$path"
                  ;;
                *)
                  echo "Manual upstream conflict requires review: $path" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
            git commit --no-edit
          fi

          current="$(git rev-parse HEAD)"
          if [[ "$current" == "$previous" ]]; then
            echo "Fork main is already current."
            exit 0
          fi

          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
