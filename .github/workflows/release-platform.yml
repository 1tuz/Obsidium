name: Release One Platform

on:
  workflow_call:
    inputs:
      platform:
        description: Platform to publish for the current application version
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.platform }} Package
    runs-on: ${{ inputs.platform == 'macOS' && 'macos-15' || inputs.platform == 'Windows' && 'windows-latest' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: inputs.platform == 'Linux'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          timeout -k 5s 60s sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          timeout -k 5s 600s sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aquilum-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.platform == 'macOS' && 'aarch64-apple-darwin' || inputs.platform == 'Windows' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - uses: actions/cache@v6
        with:
          path: .artifacts/cargo-release
          key: ${{ runner.os }}-cargo-v2-${{ inputs.platform }}-${{ hashFiles('aquilum-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-${{ inputs.platform }}-

      - name: Install frontend dependencies
        working-directory: aquilum-app
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: aquilum-app
          tauriScript: npm run tauri
          args: --features updater ${{ inputs.platform == 'macOS' && '--bundles app,dmg --target aarch64-apple-darwin' || inputs.platform == 'Windows' && '--bundles nsis --target x86_64-pc-windows-msvc' || '--bundles deb --target x86_64-unknown-linux-gnu' }}
          tagName: v__VERSION__
          releaseName: __VERSION__
          releaseBody: See the release notes below.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./aquilum-app/package.json").version')"
          gh release edit "v${version}" --draft=false --latest --repo "$GITHUB_REPOSITORY"
