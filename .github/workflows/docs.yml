name: Docs checks

on:
  push:
    paths:
      - "*.md"
      - "**/*.md"
      - "screenshots/**"
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - "screenshots/**"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          fi
