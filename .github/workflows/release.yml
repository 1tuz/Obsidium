name: Release all platforms

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aquilum-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        working-directory: aquilum-app
        run: npm ci

      - name: Check TypeScript and complete Vitest suite
        working-directory: aquilum-app
        run: |
          npx tsc --noEmit
          npm test

      - name: Check release contract tests
        run: node --test scripts/release-contract.test.mjs

      - name: Require a new descendant release tag
        run: |
          if [[ "$RELEASE_TYPE" != "tag" ]]; then
            echo "Select an existing v* tag in the manual workflow picker." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; published releases are immutable." >&2
            exit 1
          fi
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          export RELEASE_VERSION
          node scripts/validate-release.mjs "$RELEASE_TAG" "$latest_tag"
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo 'TAURI_SIGNING_PRIVATE_KEY is required to produce updater signatures.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit ${GITHUB_SHA} is not present in protected main." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ github.ref_type }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  build:
    name: Build ${{ matrix.platform }} installer
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macOS
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aquilum-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: aquilum-app
        run: npm ci

      - name: Build installer and updater bundle
        working-directory: aquilum-app
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --features updater --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}

      - name: Verify platform installers and signatures exist
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          platform="$(printf '%s' "$PLATFORM" | tr '[:upper:]' '[:lower:]')"
          node scripts/prepare-release-assets.mjs collect \
            "$platform" "${RELEASE_VERSION#v}" \
            .artifacts/cargo-release/release/bundle \
            .artifacts/release-assets

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: .artifacts/release-assets/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Verify and publish complete release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: .artifacts/release-assets

      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Verify updater signatures and generate latest.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/prepare-release-assets.mjs manifest \
            "$RELEASE_TAG" "$GH_REPOSITORY" .artifacts/release-assets
          public_key="$(node --input-type=module -e \
            'import { readFileSync } from "node:fs"; const value = JSON.parse(readFileSync("aquilum-app/src-tauri/tauri.conf.json", "utf8")).plugins.updater.pubkey; console.log(Buffer.from(value, "base64").toString("utf8").split("\n")[1])')"
          for artifact in .artifacts/release-assets/*.deb .artifacts/release-assets/*.app.tar.gz .artifacts/release-assets/*-setup.exe; do
            minisign -Vm "$artifact" -x "$artifact.sig" -P "$public_key"
          done
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync, readdirSync } from "node:fs";
            const files = readdirSync(".artifacts/release-assets");
            const manifest = JSON.parse(readFileSync(".artifacts/release-assets/latest.json", "utf8"));
            assert.equal(manifest.version, process.env.RELEASE_TAG.slice(1));
            for (const platform of ["linux-x86_64", "darwin-aarch64", "windows-x86_64"]) {
              assert.ok(manifest.platforms[platform].signature);
              assert.ok(files.some((file) => manifest.platforms[platform].url.endsWith("/" + file)));
            }
          '

      - name: Create draft with all platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" .artifacts/release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Obsidium ${RELEASE_TAG#v}" \
            --generate-notes
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
