# Release builds for Windows, macOS and Linux.
# Pushing a tag v* builds every platform into a draft release with latest.json for the updater.
# The draft is published by hand once all jobs are green, so the updater never sees a partial release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis --target x86_64-pc-windows-msvc'
            rust-targets: x86_64-pc-windows-msvc
          - platform: macos-15
            args: '--bundles dmg --target aarch64-apple-darwin'
            rust-targets: aarch64-apple-darwin
          - platform: ubuntu-24.04
            args: '--bundles deb --target x86_64-unknown-linux-gnu'
            rust-targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aquilum-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app/src-tauri -> target
          key: obsidium-v2-${{ matrix.args }}

      - name: Install frontend dependencies
        working-directory: aquilum-app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: aquilum-app
          tauriScript: npx tauri
          args: --features updater ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: __VERSION__
          releaseBody: See the release notes below.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
