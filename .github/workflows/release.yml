# Release builds for Windows, macOS and Linux.
# Pushing a tag v* builds every platform into a draft release with latest.json for the updater.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis --target x86_64-pc-windows-msvc'
            rust-targets: x86_64-pc-windows-msvc
          - platform: macos-15
            args: '--bundles dmg --target aarch64-apple-darwin'
            rust-targets: aarch64-apple-darwin
          - platform: ubuntu-24.04
            args: '--bundles deb --target x86_64-unknown-linux-gnu'
            rust-targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          timeout -k 5s 60s sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          timeout -k 5s 600s sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aquilum-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: actions/cache@v6
        with:
          path: .artifacts/cargo-release
          key: ${{ runner.os }}-cargo-v2-${{ matrix.rust-targets }}-${{ hashFiles('aquilum-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-${{ matrix.rust-targets }}-

      - name: Install frontend dependencies
        working-directory: aquilum-app
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: aquilum-app
          tauriScript: npm run tauri
          args: --features updater ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: __VERSION__
          releaseBody: See the release notes below.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            version="$(node -p 'require("./aquilum-app/package.json").version')"
            RELEASE_TAG="v${version}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
