<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Состав Obsidium</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,0.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      padding: 40px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame { width: min(100%, 1280px); margin: 0 auto; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font: 500 11px var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      font: 400 32px/1.15 var(--serif);
      letter-spacing: -.02em;
    }
    .subtitle { margin-bottom: 20px; color: var(--muted); font-size: 13px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1280px; }
    @media print {
      body { padding: 0; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

    <p class="eyebrow">Архитектура · runtime-состав</p>
    <h1>Из чего состоит Obsidium</h1>
