<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heading minimap browser regression</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #root {
        box-sizing: border-box;
        padding: 24px;
      }

      .browser-test-case {
        position: relative;
        height: min(680px, calc(100vh - 48px));
        min-height: 320px;
      }

      .browser-test-case__cover {
        height: 240px;
        flex: 0 0 240px;
      }

      .browser-test-results {
        position: fixed;
        inset: 12px 12px auto auto;
        z-index: 10;
        max-width: 420px;
        padding: 12px;
        background: var(--q-bg-surface-raised);
        color: var(--q-text-primary);
        border: 1px solid var(--q-border-default);
      }

      .browser-test-results[data-status="fail"] {
        color: var(--q-text-danger);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/testing/headingMinimapBrowserTest.tsx"></script>
  </body>
</html>
